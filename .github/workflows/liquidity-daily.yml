# Daily / backfill TCGplayer liquidity preload via Bright Data Web Unlocker.
# Stale-first + missing total_quantity — exact available qty (listings @ 50/page).
# Not a Vercel cron: multi-hour Unlocker work belongs on GHA.
#
# Secrets:
#   PIPELINE_DB_URL
#   BRIGHT_DATA_API_KEY
#   BRIGHT_DATA_UNLOCKER_ZONE
# Optional:
#   BRIGHT_DATA_UNLOCKER_ASYNC_ZONE

name: liquidity-daily

on:
  schedule:
    # After tcgcsv-daily (~21:30 UTC) — warm stale rows
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max series this run (stale-first; re-run to continue backfill)"
        required: false
        default: "25000"
      max_market:
        description: "Only series with market under this USD"
        required: false
        default: "2"
      stale_hours:
        description: "Refresh rows older than this many hours"
        required: false
        default: "24"
      mode:
        description: "sync or async"
        required: false
        default: "sync"
      concurrency:
        description: "Parallel cards"
        required: false
        default: "6"

# One Unlocker liquidity job at a time (avoid zone contention).
concurrency:
  group: liquidity-unlocker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Full under-$2 pass with listings pagination needs a long budget; re-run
    # workflow_dispatch to continue (stale-first + missing qty resumes).
    timeout-minutes: 360
    steps:
      - name: Check secrets
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_UNLOCKER_ZONE: ${{ secrets.BRIGHT_DATA_UNLOCKER_ZONE }}
        run: |
          missing=0
          for v in PIPELINE_DB_URL BRIGHT_DATA_API_KEY BRIGHT_DATA_UNLOCKER_ZONE; do
            if [ -z "${!v}" ]; then
              echo "$v secret is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install script dependency
        run: npm install --no-save --no-package-lock postgres@3.4.9

      - name: Preload liquidity (stale-first, exact qty)
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_UNLOCKER_ZONE: ${{ secrets.BRIGHT_DATA_UNLOCKER_ZONE }}
          BRIGHT_DATA_UNLOCKER_ASYNC_ZONE: ${{ secrets.BRIGHT_DATA_UNLOCKER_ASYNC_ZONE }}
          LIMIT: ${{ github.event.inputs.limit || '800' }}
          MAX_MARKET: ${{ github.event.inputs.max_market || '2' }}
          STALE_HOURS: ${{ github.event.inputs.stale_hours || '24' }}
          MODE: ${{ github.event.inputs.mode || 'sync' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '6' }}
        run: |
          node scripts/bulk-liquidity.mjs \
            --max-market "$MAX_MARKET" \
            --stale-hours "$STALE_HOURS" \
            --limit "$LIMIT" \
            --concurrency "$CONCURRENCY" \
            --mode "$MODE" \
            --endpoints details,sales,listings
