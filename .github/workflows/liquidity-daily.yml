# Cost-capped TCGplayer liquidity via Bright Data Web Unlocker.
# Ranks sets/cards from free tcgcsv price_windows, then scrapes a budgeted queue:
#   trend (details+sales) + spotlight (details+sales+listings, max 2 pages).
#
# Sustained Unlocker load causes empty-body / 502 storms — keep concurrency low.
#
# Secrets:
#   PIPELINE_DB_URL
#   BRIGHT_DATA_API_KEY
#   BRIGHT_DATA_TCGPLAYER_UNLOCKER_ZONE
# Optional:
#   BRIGHT_DATA_TCGPLAYER_UNLOCKER_ASYNC_ZONE

name: liquidity-daily

on:
  schedule:
    # After tcgcsv-daily (~21:30 UTC) — rank then scrape hot series
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      trend_limit:
        description: "Max trend-tier series (details+sales)"
        required: false
        default: "500"
      spotlight_limit:
        description: "Max spotlight-tier series (includes listings, 2 pages)"
        required: false
        default: "100"
      top_sets:
        description: "Top sets by heat to allocate trend slots across"
        required: false
        default: "40"
      mode:
        description: "sync or async"
        required: false
        default: "sync"
      concurrency:
        description: "Parallel cards (2–3 recommended)"
        required: false
        default: "3"

# One Unlocker liquidity job at a time (avoid zone contention).
concurrency:
  group: liquidity-unlocker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check secrets
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_TCGPLAYER_UNLOCKER_ZONE: ${{ secrets.BRIGHT_DATA_TCGPLAYER_UNLOCKER_ZONE }}
        run: |
          missing=0
          for v in PIPELINE_DB_URL BRIGHT_DATA_API_KEY BRIGHT_DATA_TCGPLAYER_UNLOCKER_ZONE; do
            if [ -z "${!v}" ]; then
              echo "$v secret is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Rank sets and build scrape queue
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          TREND_LIMIT: ${{ github.event.inputs.trend_limit || '500' }}
          SPOTLIGHT_LIMIT: ${{ github.event.inputs.spotlight_limit || '100' }}
          TOP_SETS: ${{ github.event.inputs.top_sets || '40' }}
        run: |
          python -m pipeline.liquidity_rank \
            --trend-limit "$TREND_LIMIT" \
            --spotlight-limit "$SPOTLIGHT_LIMIT" \
            --top-sets "$TOP_SETS"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install script dependency
        run: npm install --no-save --no-package-lock postgres@3.4.9

      - name: Scrape ranked liquidity queue
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_UNLOCKER_ZONE: ${{ secrets.BRIGHT_DATA_UNLOCKER_ZONE }}
          BRIGHT_DATA_TCGPLAYER_UNLOCKER_ZONE: ${{ secrets.BRIGHT_DATA_TCGPLAYER_UNLOCKER_ZONE }}
          BRIGHT_DATA_TCGPLAYER_UNLOCKER_ASYNC_ZONE: ${{ secrets.BRIGHT_DATA_TCGPLAYER_UNLOCKER_ASYNC_ZONE }}
          MODE: ${{ github.event.inputs.mode || 'sync' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '3' }}
        run: |
          node scripts/bulk-liquidity.mjs \
            --from-queue \
            --concurrency "$CONCURRENCY" \
            --mode "$MODE" \
            --spotlight-listings-pages 2
