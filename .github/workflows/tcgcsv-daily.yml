# Daily tcgcsv price refresh — free GitHub Actions (public repo).
# Downloads today's (or yesterday's) archive, upserts daily_prices, recomputes
# price_windows. Not a Vercel cron — Python + 7z + bulk Postgres.
#
# Secret required: PIPELINE_DB_URL (Supabase session pooler, port 5432)

name: tcgcsv-daily

on:
  schedule:
    # After tcgcsv publishes ~20:00 UTC
    - cron: "30 21 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secret
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
        run: |
          if [ -z "$PIPELINE_DB_URL" ]; then
            echo "PIPELINE_DB_URL secret is not set (use Supabase session pooler port 5432)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Refresh catalog
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
        run: python -m pipeline.catalog

      - name: Incremental prices
        env:
          PIPELINE_DB_URL: ${{ secrets.PIPELINE_DB_URL }}
        run: python -m pipeline.prices --incremental
